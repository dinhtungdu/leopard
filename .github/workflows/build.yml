# Builds and tests the single file for Linux x86_64 and aarch64 on every push
# and pull request. Pushing a tag such as v0.1.0 also publishes a GitHub
# release with both files and their checksums.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.runner }}
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ./test.sh "dist/leopard-php$PHP_VERSION-linux-$(uname -m)"
      - uses: actions/upload-artifact@v4
        with:
          name: leopard-php${{ matrix.php }}-${{ matrix.runner }}
          path: dist/leopard-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum leopard-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
